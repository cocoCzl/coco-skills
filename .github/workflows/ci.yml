name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check skill package structure
        run: python -B scripts/check_all_skills.py
      - name: Run all unit tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'

  java-examples:
    name: Java reference examples (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Require paired JDK 21 and execute Java examples
        run: |
          javac -version
          java -version
          python -B - <<'PY'
          import unittest
          from tests.java_coding_standards import test_java_examples as examples

          if 21 not in examples.JDKS:
              raise SystemExit("A functional javac/java 21 pair is required")
          suite = unittest.defaultTestLoader.loadTestsFromModule(examples)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit("Java examples must pass without skips in this CI job")
          PY

  pdf-qa:
    name: PDF QA (Ubuntu 24.04, Python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local PDF rendering and validation stack
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fontconfig \
            fonts-noto-cjk \
            libcairo2 \
            libffi-dev \
            libgdk-pixbuf-2.0-0 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            poppler-utils \
            shared-mime-info
          python -m pip install --upgrade pip
          python -m pip install --requirement ai-resume-expert/requirements-pdf.txt
          python -m pip check
      - name: Require a functional PDF stack
        run: |
          command -v weasyprint
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          command -v pdffonts
          fc-match "Noto Sans CJK SC"
          python -B - <<'PY'
          import runpy

          namespace = runpy.run_path("tests/ai_resume_expert/test_pdf_pipeline.py")
          if not namespace["LOCAL_PDF_STACK"]:
              raise SystemExit("ai-resume-expert PDF renderer or Poppler stack is unavailable")
          print("Functional ai-resume-expert PDF stack confirmed.")
          PY
      - name: Run PDF integration and validation tests
        run: python -B -m unittest discover -s tests/ai_resume_expert -p 'test_pdf_pipeline.py' -v
